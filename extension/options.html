<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Cuboid QC cho CVAT - Tùy chọn</title>
<style>
  body { font: 14px/1.5 system-ui, "Segoe UI", sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1c1f26; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  input, select { width: 100%; padding: 6px 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 6px 14px; margin-right: 8px; }
  .hint { color: #5b6270; font-size: 12.5px; font-weight: 400; }
  #status { margin-top: 14px; white-space: pre-wrap; }
  .ok { color: #1b7f3b; } .bad { color: #b3261e; } .warn { color: #8a5a00; }
</style>
</head>
<body>
<h2>Cuboid QC cho CVAT</h2>
<p class="hint">Extension cần server QC chạy trên máy: <code>python scripts/run_server.py</code>.
Server in ra một <b>token</b> (lưu trong <code>.qc_token</code>), dán vào ô bên dưới.</p>

<label for="serverUrl">Địa chỉ server QC</label>
<input id="serverUrl" placeholder="http://127.0.0.1:8766">

<label for="token">Token</label>
<input id="token" type="password" autocomplete="off" placeholder="dán token do server in ra">

<label for="policy">Chính sách khi bấm "Tự sửa"</label>
<select id="policy">
  <option value="conservative">conservative (khuyến nghị): chỉ lật hướng khi ERROR và sửa kích thước theo track</option>
  <option value="all">all: áp dụng mọi gợi ý có box (có thể làm hỏng nhãn đúng)</option>
</select>
<p class="hint warn">Với "all", dịch box tự động đã được đo là làm hỏng nhãn đúng ở phần lớn trường hợp. Chỉ dùng khi bạn sẽ xem lại từng box.</p>

<button id="save">Lưu</button><button id="test">Kiểm tra kết nối</button>
<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
